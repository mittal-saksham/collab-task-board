name: CI

# Run on every push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The current suite (fractional-ordering math) is pure — it needs no
      # database or secrets. When DB-backed API tests are added, give this job a
      # `services: postgres:` block and a DATABASE_URL_OVERRIDE env var.
      - run: python -m pytest -q

  frontend:
    name: Frontend · build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc type-check + vite build
      - run: npm test        # vitest run
