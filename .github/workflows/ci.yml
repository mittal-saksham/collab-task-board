name: CI

# Run on every push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres for the DB-backed API tests. conftest.py creates a `taskapp_test`
    # database on it (the POSTGRES_USER is a superuser, so it can CREATE DATABASE).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskapp
          POSTGRES_DB: taskapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Settings reads these (no .env file in CI). Point at the service above.
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp
      POSTGRES_DB: taskapp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-test-secret-not-used-anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend · build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc type-check + vite build
      - run: npm test        # vitest run
